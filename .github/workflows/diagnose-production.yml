name: Diagnose production profile
on:
  pull_request:
    paths: ['.github/workflows/diagnose-production.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Compare public production and immutable preview responses
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, hashlib, json, time
          bases = ['https://mayphus.org', 'https://118b9cad-mayphus.mayphus.workers.dev']
          paths = ['/healthz', '/', '/profile/', '/profile/index.html', '/agents/', '/infrastructure/', '/typing/', '/mcp', '/agent-index.json', '/documents.json', '/api/search?q=Linux']
          for base in bases:
              for path in paths + ['/profile/?__diagnostic=' + str(int(time.time()))]:
                  url = base + path
                  try:
                      request = urllib.request.Request(url, headers={'Cache-Control':'no-cache', 'User-Agent':'Mayphus-release-diagnostic/1.0'})
                      try:
                          response = urllib.request.urlopen(request, timeout=30)
                      except urllib.error.HTTPError as error:
                          response = error
                      body = response.read()
                      headers = {key: response.headers.get(key) for key in ['content-type','cache-control','cf-cache-status','age','cf-ray','server','location','x-mayphus-review']}
                      print(json.dumps({'url':url,'final_url':response.geturl(),'status':response.status,'headers':headers,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest(),'prefix':body[:180].decode('utf-8',errors='replace')}), flush=True)
                  except Exception as error:
                      print(json.dumps({'url':url,'error':str(error)}), flush=True)
          PY
