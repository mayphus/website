name: Ship
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Poll trusted content main using the existing read-only key; no cross-repo token.
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
# The review alias and production belong to one serialized release chain.
concurrency:
  group: mayphus-release
  cancel-in-progress: false
jobs:
  ship:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://mayphus.org
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Attach the event commit to main
        run: git switch -C main "$GITHUB_SHA"
      - name: Skip superseded commits before installing or uploading
        id: current
        shell: bash
        run: |
          set -euo pipefail
          remote=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$remote" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipped superseded commit $GITHUB_SHA; main is $remote." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: ./.github/actions/setup
        if: steps.current.outputs.current == 'true'
        with:
          content-read-key: ${{ secrets.CONTENT_READ_KEY }}
      - name: Review and promote the same version
        if: steps.current.outputs.current == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run release
