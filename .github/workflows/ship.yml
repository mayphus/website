name: Ship
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_repository:
        description: Checked source repository (all source fields empty for a manual retry)
        required: false
        type: string
      source_sha:
        description: Immutable checked content main commit; a wake-up identity, never a checkout ref
        required: false
        type: string
      source_run_id:
        description: Successful content Check workflow run ID
        required: false
        type: string
      source_run_attempt:
        description: Successful content Check workflow run attempt
        required: false
        type: string
permissions:
  contents: read
# The review alias and production belong to one serialized release chain.
concurrency:
  group: mayphus-release
  cancel-in-progress: false
jobs:
  ship:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://mayphus.org
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate the wake-up identity without executing event-selected code
        run: node scripts/publication-event.mjs
      - name: Attach the resolved trusted website main
        run: git switch -C main HEAD
      - name: Skip superseded commits before installing or uploading
        id: current
        shell: bash
        run: |
          set -euo pipefail
          remote=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          current=$(git rev-parse HEAD)
          if [ "$remote" = "$current" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipped superseded commit $current; main is $remote." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: ./.github/actions/setup
        if: steps.current.outputs.current == 'true'
        with:
          content-read-key: ${{ secrets.CONTENT_READ_KEY }}
          # Checkout removes its temporary SSH key in its post-job cleanup.
          # Trusted main needs read-only access for the final moving-main guard.
          retain-content-access: true
      - name: Read current production deployment identity
        if: steps.current.outputs.current == 'true'
        id: production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/production-provenance.mjs identity
      - name: Restore success receipt for this exact production deployment
        if: steps.current.outputs.current == 'true' && steps.production.outputs.cache-key != ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/verified-production.json
          key: ${{ steps.production.outputs.cache-key }}
      - name: Compare verified receipt against current production and both sources
        if: steps.current.outputs.current == 'true'
        id: reuse
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/production-provenance.mjs reuse
      - name: Review and promote the same version
        if: steps.current.outputs.current == 'true' && steps.reuse.outputs.unchanged != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run release
      - name: Record success only after strict production verification
        if: success() && steps.current.outputs.current == 'true' && steps.reuse.outputs.unchanged != 'true'
        id: verified
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/production-provenance.mjs record
      - name: Save verified receipt for the exact deployed production identity
        if: success() && steps.current.outputs.current == 'true' && steps.verified.outputs.cache-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/verified-production.json
          key: ${{ steps.verified.outputs.cache-key }}
